<!-- Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4"
     (click)="close()">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-5 font-sans"
       (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-slate-900">Share post</h2>
      <button (click)="close()"
              class="text-slate-400 hover:text-slate-700 text-2xl leading-none transition-colors">&times;</button>
    </div>

    <textarea [formControl]="body" rows="3"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-[15px] text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-300 transition-all resize-none mb-4"
              placeholder="Say something about this..."></textarea>

    <!-- preview always shows the ORIGINAL post -->
    <div class="border border-slate-200 rounded-xl p-3 bg-slate-50 mb-5">
      <div class="flex items-center gap-2 mb-2">
        <img [src]="previewPost.user.photo" [alt]="previewPost.user.username"
             class="size-8 rounded-full object-cover border border-slate-100 shrink-0" />
        <div>
          <p class="text-[14px] font-bold text-slate-900 leading-tight">{{ previewPost.user.name }}</p>
          <p class="text-[12px] text-slate-400">@{{ previewPost.user.username }} · {{ previewPost.createdAt | timeago }}</p>
        </div>
      </div>
      @if (previewPost.body) {
        <p class="text-[14px] text-slate-700 mb-2 break-words">{{ previewPost.body }}</p>
      }
      @if (previewPost.image) {
        <img [src]="previewPost.image" class="w-full max-h-52 object-cover rounded-lg" alt="" />
      }
    </div>

    <div class="flex justify-end gap-3">
      <button (click)="close()"
              class="px-5 py-2 rounded-lg border border-slate-200 text-slate-700 font-semibold text-[14px] hover:bg-slate-50 transition-colors">
        Cancel
      </button>
      <button (click)="share()"
              class="px-5 py-2 rounded-lg bg-gradient-to-br from-blue-800 to-purple-800 text-white font-bold text-[14px] hover:opacity-90 transition-opacity disabled:opacity-60 flex items-center gap-2"
              [class.opacity-60]="isLoading"
              [class.pointer-events-none]="isLoading">
        @if (isLoading) { <i class="fa-solid fa-spinner fa-spin"></i> }
        Share now
      </button>
    </div>

  </div>
</div>
