<aside class="bg-white sticky top-4 rounded-3xl shadow-sm border border-slate-100 p-4 font-sans ">
    <div class="flex items-center justify-between mb-4 px-1">
        <div class="flex items-center gap-2">
            <i
                class="fa-solid fa-user-group bg-gradient-to-r from-blue-800 to-purple-800 bg-clip-text text-transparent text-[1.1rem]"></i>
            <h2 class="font-bold text-slate-900 text-[17px]">Suggested Friends</h2>
        </div>
        <span
            class="bg-gradient-to-r from-blue-800 to-purple-800 text-white text-xs font-bold px-2.5 py-1 rounded-full">{{visibleSuggestions.length}}</span>
    </div>
    <div class="max-h-96 overflow-y-auto custom-scroll px-1">
        @for (suggested of visibleSuggestions; track suggested._id) {

        <div class="relative mb-4 ">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
            </div>
            <input type="text"
                class="bg-white border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 placeholder-slate-400 outline-none transition-all"
                placeholder="Search friends..." aria-label="Search friends" />
        </div>

        <div class="grid gap-3 overflow-y-auto max-h-88 pb-1">
            <div class="p-3 border border-slate-200 rounded-2xl bg-white hover:border-slate-300 transition-colors">
                <div class="flex items-start gap-3">
                    <img [src]="suggested.photo" [alt]="suggested.name"
                        class="w-11 h-11 rounded-full object-cover shrink-0 bg-slate-100 border border-slate-50" />

                    <div class="flex-1 min-w-0 flex flex-col gap-2">
                        <div class="flex items-center justify-between gap-2 mt-0.5">
                            <div class="flex flex-col min-w-0">
                                <span class="text-[14px] font-bold text-slate-900 truncate leading-tight">
                                    {{suggested.name}}</span>
                                <span
                                    class="text-[13px] text-slate-500 truncate leading-tight mt-0.5">@{{suggested.username}}</span>
                            </div>
                            <span ></span>
                            <span class="bg-gradient-to-r from-blue-100 to-purple-100 rounded-xl">
                                 <button
                                class="shrink-0 flex items-center gap-1.5 px-3.5 py-1.5  bg-gradient-to-r from-blue-800 to-purple-800 bg-clip-text text-transparent text-[13px] font-bold rounded-xl duration-300 transition-colors cursor-pointer">
                                <i class="fa-solid fa-user-plus text-[11px]"></i>
                                Follow
                            </button>
                            </span>
                           
                        </div>

                        <div class="flex items-center gap-2">
                            <span
                                class="text-[11px] font-semibold text-slate-500 px-2 py-1 rounded-lg">{{suggested.followersCount}}
                                followers
                            </span>
                            <span class="bg-gradient-to-r from-blue-50 to-purple-50"><span
                                    class="text-[11px] font-semibold bg-gradient-to-r from-blue-800 to-purple-800 bg-clip-text text-transparent px-2 py-1 rounded-lg">{{suggested.mutualFollowersCount}}
                                    mutual</span>
                                </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>

    <button (click)="showAll = !showAll"
        class="w-full cursor-pointer mt-3 py-2.5 bg-white border border-slate-200 rounded-xl text-[14px] font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all outline-none focus:ring-4 focus:ring-slate-100">
        {{ showAll ? 'Show less' : 'View more' }}
    </button>
</aside>
