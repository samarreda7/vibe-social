<div class="min-h-screen bg-slate-100 p-6">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">

        <!-- Header -->
        <div class="flex items-center gap-4 mb-6">
            <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800">Change Password</h1>
                <p class="text-sm text-slate-400 mt-0.5">Keep your account secure by using a strong password.</p>
            </div>
        </div>

        <!-- Form -->
        <form action="">
            <div class="space-y-5">

                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Current password</label>
                    <input type="password" placeholder="Enter current password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition" />
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">New password</label>
                    <input type="password" placeholder="Enter new password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition" />
                    <p class="text-xs text-slate-400 mt-1.5">At least 8 characters with uppercase, lowercase, number,
                        and special character.</p>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Confirm new password</label>
                    <input type="password" placeholder="Re-enter new password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition" />
                </div>

                <!-- Submit Button -->
                <button
                    class="w-full py-3.5 rounded-xl bg-blue-400 hover:bg-blue-500 text-white text-sm font-semibold transition-colors">
                    Update password
                </button>

            </div>
        </form>
    </div>
</div>
